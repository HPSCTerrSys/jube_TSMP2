# -------------------------------------------------------------------------------------------------
# Section 0: Preamble
# -------------------------------------------------------------------------------------------------
# The name of the benchmark
name: TSMP2_WFE

# Working directory of the workflow step
# Set the outpath to `/dev/null` to force the user to specify an output path manually
# jube -v run -r -e --tag <machineTag> <combinationTag> --outpath ./outpath  jube_tsmp2_build.yml 
outpath: /dev/null

# -------------------------------------------------------------------------------------------------
# Section 1: Parameter Configuration
# -------------------------------------------------------------------------------------------------

# Make auxiliary source/files available to the workflow
# The locations can be relative to the jube file
# .../benchmark/jube/jube_tsmp2_wfe_CI.yml
fileset:        
 - name: auxcompare
   copy: ../../usecompare/*

parameterset:
  # 0. User specific information running the benchmark
  #  MODIFY: 
  #         branch_name: master, dev-name  # Write the name of the branch you want to use from TSMP2
  #         bin_storage:                   # Write the path where to store binaries built
  #                                        # Binaries will be copied in ${bin_storage}/${branch_name}/${system_name}_${model_id}_${env_str}
  #         ref_storage:                   # Reference case will be retrieved from ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}
  #         ref_system: JURECADC, JUPITER  # Write the name of the system from the reference case (Note: JURECADC has all reference cases)
  #         ref_branch: master             # Write the name of the reference branch (Note: master has all reference cases)
  #         ref_env: jsc.2025.gnu.openmpi  # Write the environment from the reference case (gnu.openmpi and gnu.psmpi produce same results, but not intel.psmpi)
  #                                        # /p/project1/cslts/shared_data/CI_TSMP2/out_ref/JURECADC_jsc.2025.gnu.openmpi/
  #                                          ${ref_storage}/${ref_system}_${ref_env}
  #                                        # TO DO if all machines and environments have references then replace ref_system and ref_env by ${system_name} and ${env_str}
  - name: userInfo
    parameter:
      - {name: branch_name, _: master}
      - {name: ref_branch, _: master}
      - {name: ref_env, _: $env_str}                  # jsc.2025.gnu.openmpi, $env_str
      - {name: ref_system, _: JURECADC}               # JURECADC, $system_name
      - {name: ref_system, tag: jupiter,_: JUPITER}   # JURECADC, $system_name

  # 00. Info test case used
  # WFE: name of the repository, e.g., TSMP2_workflow-engine
  # branch_name_WFE: name of the branch to use from the WFE repository, e.g., master
  # date_str: initialdate of the simulation (YYYYMMDD)
  # date_rest_icon: date of the restart file for ICON (YYYYMMDD)
  # date_rest_eclm: date of the restart file for eCLM (YYYY-MM-DD)
  # expid: expid of the experiment in the master.conf file (in ctl/), e.g., eur-11u

  - name: testcaseInfo
    parameter:
    - {name: WFE, _: TSMP2_workflow-engine}
    - {name: branch_name_WFE, _: master}
    - {name: date_str, _: 20170701}
    - {name: date_rest_icon, _: 20170702}
    - {name: date_rest_eclm, _: 2017-07-02}  
    - {name: expid, _: eur-11u}


  # 000. System specific information running the benchmark
  #    Tags for each machine: jurecadc, juwels, jupiter, jusuf
  - name: systemInfo
    parameter:
      - name: system_name_hardcode
        mode: shell
        _: "cat /etc/FZJ/systemname |tr -d \"\n\""
      # Eventually, the version would be dynamically read, till then we hardcode the value.
      # --> NOT USED ?--> TO DO: REMOVE
      - name: system_version
        mode: shell
        _: "echo 2024.01"
 
      - {name: mode_exec, tag: full, _: full}
      - {name: mode_exec, tag: build, _: build}
      - {name: mode_exec, tag: run, _: run} 
        
      - {name: system_name, tag: jurecadc, _: JURECADC}
      - {name: system_name, tag: juwels, _: JUWELS}
      - {name: system_name, tag: jupiter, _: JUPITER}
      - {name: system_name, tag: jusuf, _: JUSUF}

      - {name: taskspernode, tag: gpu, _: 4}
      - {name: taskspernode, tag: jurecadc, _: 128}
      - {name: taskspernode, tag: juwels, _: 48}
      - {name: taskspernode, tag: jupiter, _: 288}
      - {name: taskspernode, tag: jusuf, _: 128}
      
      - {name: threadspertask, tag: gpu, _: 4}
      - {name: threadspertask, tag: jurecadc, _: 128}
      - {name: threadspertask, tag: juwels, _: 48}
      - {name: threadspertask, tag: jupiter, _: 288}
      - {name: threadspertask, tag: jusuf, _: 128}
      
      - {name: pfl_nodes, tag: gpu, _: 1}
      - {name: pfl_nodes, tag: jurecadc|juwels|jusuf, _: 2}
      - {name: pfl_nodes, tag: jupiter, _: 1}
 
      - {name: clm_nodes, tag: jurecadc|juwels|jusuf, _: 1}
      - {name: clm_nodes, tag: jupiter, _: 1}  

      - {name: ico_nodes, tag: jurecadc|juwels|jusuf, _: 3}
      - {name: ico_nodes, tag: jupiter, _: 1}

      - {name: root_storage, tag: jurecadc|jusuf|juwels, _: "/p/project1/cslts/shared_data/CI_TSMP2"}
      - {name: root_storage, tag: jupiter, _: "/e/project1/eessx/shared_data/CI_TSMP2"}

      - {name: bin_storage, _: "${root_storage}/bin"}      
      # - {name: bin_storage, tag: jurecadc|jusuf|juwels, _: "/p/project1/cslts/shared_data/CI_TSMP2/bin"}
      # - {name: bin_storage, tag: jupiter, _: "/e/project1/eessx/shared_data/CI_TSMP2/bin"}

      - {name: ref_storage, _: "${root_storage}/out_ref"}      
      # - {name: ref_storage, tag: jurecadc|jusuf|juwels, _: "/p/project1/cslts/shared_data/CI_TSMP2/out_ref"}
      # - {name: ref_storage, tag: jupiter, _: "/e/project1/eessx/shared_data/CI_TSMP2/out_ref"}

      - {name: build_env_path, _: "${jube_benchmark_rundir}/000001_build/work/TSMP2/bin/${system_name}_${model_id}/${env_str}"}
      - {name: compare_path, _: "${jube_benchmark_rundir}/000006_compare/work/"} 


  # 1. File name to check run is finished   
  # - name: finished_run
    # parameter:
      # - {name: done_run, _: ready}
  - name: finished_run
    parameter:
    - {name: done_run, tag: icon+!eclm+!parflow+!parflowgpu, _: "${expid}_restart_ATMO_${date_rest_icon}T000000Z.nc"}
    - {name: done_run, tag: eclm+!icon+!parflow+!parflowgpu, _: "eCLM_${expid}.datm.rs1.${date_rest_eclm}-00000.bin"}
    - {name: done_run, tag: parflow|parflowgpu+!icon+!eclm, _: "${expid}.out.00001.nc"}
    - {name: done_run, tag: icon+eclm+!parflow+!parflowgpu, _: "eCLM_${expid}.datm.rs1.${date_rest_eclm}-00000.bin"}
    - {name: done_run, tag: eclm+parflow|parflowgpu+!icon, _: "eCLM_${expid}.datm.rs1.${date_rest_eclm}-00000.bin"}
    - {name: done_run, tag: icon+eclm+parflow|parflowgpu, _: "eCLM_${expid}.datm.rs1.${date_rest_eclm}-00000.bin"}
    - {name: done_run, tag: "!icon+!eclm+!parflow+!parflowgpu", _: "eCLM_${expid}.datm.rs1.${date_rest_eclm}-00000.bin"}
 
 
  # 2. TSMP2-components for the build
  #    Tags for each TSMP2 component: icon, eclm, parflow
  #    If no component-combination is specified, it will build by default "eclm" 
  #    If no environment is specified, it will use "default.2025.env"
  #    a) combination_str   --> components for the build command
  #    b) model_id          --> model ID to use for the building folders
  #    c) env_str           --> tag that defines the environment
  #
  - name: combinationTsmp
    parameter: 
  #  
  # 2.a For the build command: TO DO add parflowGPU
    - {name: combination_str, tag: icon+!eclm+!parflow+!parflowgpu, _: --icon}
    - {name: combination_str, tag: eclm+!icon+!parflow+!parflowgpu, _: --eclm}
    - {name: combination_str, tag: parflow+!icon+!eclm+!parflowgpu, _: --parflow}
    - {name: combination_str, tag: icon+eclm+!parflow+!parflowgpu, _: --icon --eclm}
    - {name: combination_str, tag: eclm+parflow+!icon+!parflowgpu, _: --parflow --eclm}
    - {name: combination_str, tag: icon+eclm+parflow+!parflowgpu, _: --icon --eclm --parflow}
    - {name: combination_str, tag: "!icon+!eclm+!parflow+!parflowgpu", _: --eclm}
    - {name: combination_str, tag: parflowgpu+!icon+!eclm+!parflow, _: --parflowGPU}
    - {name: combination_str, tag: parflowgpu+eclm+!icon+!parflow, _: --eclm --parflowGPU}
    - {name: combination_str, tag: parflowgpu+icon+eclm+!parflow, _: --icon --eclm --parflowGPU}
  #
    # 2.b Model ID for build:
    - {name: model_id, tag: icon+!eclm+!parflow+!parflowgpu, _: ICON}
    - {name: model_id, tag: eclm+!icon+!parflow+!parflowgpu, _: eCLM}
    - {name: model_id, tag: parflow+!icon+!eclm+!parflowgpu, _: ParFlow}
    - {name: model_id, tag: icon+eclm+!parflow+!parflowgpu, _: ICON-eCLM}
    - {name: model_id, tag: eclm+parflow+!icon+!parflowgpu, _: eCLM-ParFlow}
    - {name: model_id, tag: icon+eclm+parflow+!parflowgpu, _: ICON-eCLM-ParFlow}
    - {name: model_id, tag: "!icon+!eclm+!parflow+!parflowgpu", _: eCLM}
    - {name: model_id, tag: parflowgpu+!icon+!eclm+!parflow, _: ParFlowGPU}
    - {name: model_id, tag: parflowgpu+eclm+!icon+!parflow, _: eCLM-ParFlowGPU}
    - {name: model_id, tag: parflowgpu+icon+eclm+!parflow, _: ICON-eCLM-ParFlowGPU}
  #  
    # 2.b Model ID for running sim:
    - {name: model_id_sim, tag: icon+!eclm+!parflow+!parflowgpu, _: icon}
    - {name: model_id_sim, tag: eclm+!icon+!parflow+!parflowgpu, _: eclm}
    - {name: model_id_sim, tag: parflow+!icon+!eclm+!parflowgpu, _: parflow}
    - {name: model_id_sim, tag: icon+eclm+!parflow+!parflowgpu, _: iconeclm}
    - {name: model_id_sim, tag: eclm+parflow+!icon+!parflowgpu, _: eclmparflow}
    - {name: model_id_sim, tag: icon+eclm+parflow+!parflowgpu, _: iconeclmparflow}
    - {name: model_id_sim, tag: "!icon+!eclm+!parflow+!parflowgpu", _: eclm}  
    - {name: model_id_sim, tag: parflowgpu+!icon+!eclm+!parflow, _: parflowgpu}
    - {name: model_id_sim, tag: parflowgpu+eclm+!icon+!parflow, _: eclmparflowgpu}
    - {name: model_id_sim, tag: parflowgpu+icon+eclm+!parflow, _: iconeclmparflowgpu}
  #
  # 2.c Environment:
    - {name: env_str, _: jsc.2025.intel.psmpi}                                          
    - {name: env_str, tag: jsc.2026.nvhpc.openmpi, _: jsc.2026.nvhpc.openmpi}
    - {name: env_str, tag: jsc.2026.gnu.openmpi, _: jsc.2026.gnu.openmpi}
    - {name: env_str, tag: jsc.2025.gnu.openmpi, _: jsc.2025.gnu.openmpi}
    - {name: env_str, tag: jsc.2025.gnu.psmpi, _: jsc.2025.gnu.psmpi}
    - {name: env_str, tag: jsc.2025.intel.psmpi, _: jsc.2025.intel.psmpi}
    - {name: env_str, tag: jsc.2024.intel.psmpi, _: jsc.2024.intel.psmpi}
    - {name: env_str, tag: jsc.2023.intel.psmpi, _: jsc.2023.intel.psmpi}
    - {name: env_str, tag: default.2025.env, _: jsc.2025.gnu.openmpi}
    #- {name: env_str, tag: "!jsc.2025.intel.psmpi+!jsc.2025.gnu.openmpi+!jsc.2025.gnu.psmpi+!jsc.2024.intel.psmpi+!jsc.2023.intel.psmpi+!default.2025.env+!jsc.2026.gnu.openmpi+!jsc.2026.nvhpc.openmpi", _: jsc.2025.intel.psmpi}


  # 3. Collect the input parameters which are specified either through:
  #    - the tags passed on the JUBE-command or 
  #    - the "usecase" variable of the CI-gitlab 
  - name: inputParam
    parameter: 

    # Bench queue: TO DO add GPU queues 
    - {name: bench_queue, tag: jurecadc, _: dc-cpu}
    - {name: bench_queue, tag: juwels, _: batch}
    - {name: bench_queue, tag: jusuf, _: batch}
    - {name: bench_queue, tag: jupiter, _: booster}

    # Change account     
    - {name: bench_account, tag: jurecadc, _: slts}
    - {name: bench_account, tag: juwels, _: slts}
    - {name: bench_account, tag: jusuf, _: slts}
    - {name: bench_account, tag: jupiter, _: eessx}
    
    # Define parameter for the number of nodes
    - {name: variant, tag: single, _: single}
    - {name: variant, tag: strong.tiny, _: strong.stiny}
    - {name: variant, tag: "!single+!strong.tiny", _: single}
 
 
  # 4. Execution mode
  #    full = build + run
  #    build = only build
  #    run = only run (it skips build)
  #    If no execution mode is defined, it will only build
  #    To be able to use "run" mode, the combination build must have been build previously
  #
  - name: execMode
    parameter:
      # TO BUILD
      - name: build_command
        tag: full|build|!full+!build+!run
        _: 
           git clone -b ${branch_name} https://github.com/HPSCTerrSys/TSMP2.git ;
           cd TSMP2 ;
           echo $(pwd) ;
           git branch -a ;
           echo $(pwd) ;
           ml ;
           echo "build_tsmp2.sh ${combination_str} --env ./env/${env_str}" ;
           bash build_tsmp2.sh ${combination_str} --env ./env/${env_str} ;
           ml ;
#           mkdir -p ${bin_storage}/${branch_name}/${system_name}_${model_id}_${env_str} ;
#           cp -r ./bin/${system_name}_${model_id}/* ${bin_storage}/${branch_name}/${system_name}_${model_id}_${env_str}
#           cp -r ./bin/${system_name}_${model_id} /p/project1/cslts/shared_data/CI_TSMP2/bin/${system_name}_${model_id}_${env_str}
      #
      # TO NOT BUILD 
      # To save time when one build for that combination already exists
      # combination: systemname_components_environment. For instance: JURECADC_ICON-eCLM-ParFlow_jsc.2025.gnu.openmpi
      - name: build_command
        tag: run
        _: 
           mkdir -p TSMP2/bin/${system_name}_${model_id} ;
           cp -r ${bin_storage}/${branch_name}/${system_name}_${model_id}_${env_str}/* ./TSMP2/bin/${system_name}_${model_id}
      #
      # TO RUN 
      - name: run_command
        _: 
           git clone -b ${branch_name_WFE} https://github.com/HPSCTerrSys/${WFE}.git ;
           wfe_dir=$(realpath ${WFE}) ;
           mkdir -p ${WFE}/dta/forcing/eclm ;
           mkdir -p ${WFE}/dta/forcing/icon/latbc ;
           ln -sf ${root_storage}/download_data/forcing/eclm/forcing ${WFE}/dta/forcing/eclm/forcing ;
           ln -sf ${root_storage}/download_data/forcing/icon/latbc/201707 ${WFE}/dta/forcing/icon/latbc/201707 ;
           ln -sf ${root_storage}/download_data/restart/20170630 ${WFE}/dta/restart/20170630 ;
           cd ${wfe_dir} ;
           git submodule update --init ;
           cd ${wfe_dir}/ctl ;
           echo "current_dir= $(pwd)" ;
           sed -i -e 's/MODEL_ID=ICON-eCLM-ParFlow/MODEL_ID=${model_id}/g' master.conf ;
           sed -i -e 's/lsim=( true true true )/lsim=( true true false )/g' master.conf ;
           sed -i -e 's/sim_wallclock=00:25:00/sim_wallclock=00:45:00/g' master.conf ;
           sed -i -e 's/debugmode=false/debugmode=true/g' master.conf ;
           sed -i -e 's/account=""/account="${bench_account}"/g' master.conf ;
           sed -i -e 's/ico_node=3/ico_node=${ico_nodes}/g' master.conf ;
           sed -i -e 's/clm_node=1/clm_node=${clm_nodes}/g' master.conf ;
           sed -i -e 's/pfl_node=2/pfl_node=${pfl_nodes}/g' master.conf ;
           sed -i -e 's|tsmp2_dir=$TSMP2_DIR|tsmp2_dir=\"${jube_benchmark_rundir}/000004_execute/work/${WFE}\"|g' master.conf ;
           sed -i -e 's|tsmp2_install_dir=""|tsmp2_install_dir=\"${jube_benchmark_rundir}/000001_build/work/TSMP2/bin/${system_name}_${model_id}\"|g' master.conf ;
           sed -i -e 's|tsmp2_env=""|tsmp2_env=\"${jube_benchmark_rundir}/000001_build/work/TSMP2/bin/${system_name}_${model_id}/${env_str}\"|g' master.conf ;
           sed -i -e 's/EXP_ID="eur-12-iic"/EXP_ID="${expid}"/g' master.conf ;
           echo "model_id= ${model_id}" ;
           echo "env_str= ${env_str}" ;
           echo "current_dir= $(pwd)" ;
           cd sim_ctl ;
           sed -i -e 's/TIME_END=$(date +%s)/TIME_END=$(date +%s) ; touch ready; RUNTIME_sec=$(( TIME_END - TIME_START )); echo "The runtime is ${RUNTIME_sec} seconds." ;/g' sim_run.sh ;
           cd .. ;
           bash control_tsmp2.sh ;
           echo "current_dir_ctl= $(pwd)" ;
           cp ../run/sim_*/tsmp2.job . ;
           cp ../run/sim_*/slm_multiprog_mapping.conf . ;
           cd ../run/sim_${model_id_sim}_${date_str} ;
           echo "current_dir_run= $(pwd)" ;
           sbatch tsmp2.job > run.jobid 
           

      #
      # TO NOT RUN
      # - name: run_command
        # tag: build|!full+!build+!run
        # _: echo 'Run nothing'

  # 5. Download data mode
  #    data = it downloads data
  #    nodata = it doesn't download data
  #    If no download data mode is defined, it will download the data by default
  #    To use the "nodata" mode, data must have been downloaded previously
  #
  - name: downloadData
    parameter:
      # TO DOWNLOAD DATA
      # Downloads data and saves it on a folder outside the \outpath so it can be used for other jube-submissions
      - name: download_command
        tag: data
        _: 
           mkdir -p ${root_storage}/download_data ;
           cd ${root_storage}/download_data ;
           wget -x -l 8 -nH --cut-dirs=4 -e robots=off --recursive --no-parent --reject="index.html*" https://datapub.fz-juelich.de/slts/tsmp_testcases/data/tsmp2_eur11_wfe_iniforc/ ;
      #
      # TO NOT DOWNLOAD DATA, DATA is LINKED
      - name: download_command
        tag: nodata|(!data+!nodata)
        _: echo 'Download nothing'

  # 6. Comparison with reference case
  #    eclm
  - name: compareTsmp
    parameter:
           
      - name: compare_command
        tag: (eclm+!parflow+!icon+!parflowgpu)|(!icon+!eclm+!parflow+!parflowgpu)
        _:
           bash compare_nc_eclm.sh ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/eCLM_${expid}.clm2.h0.2017-07-01-00000.nc ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}/${model_id_sim}_${date_str}/eCLM_${expid}.clm2.h0.2017-07-01-00000.nc > Errors_output_eclm.out ;
           cp ./Errors_output_eclm.out ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/Errors_output_eclm.out ;
           
           echo "Ref_path= ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}/${model_id_sim}_${date_str}/";
           echo "Test_path= ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/"

      - name: compare_command
        tag: parflow+!parflowgpu+!eclm+!icon
        _:
           bash compare_nc_parflow.sh ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/${expid}.out.00001.nc ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}/${model_id_sim}_${date_str}/${expid}.out.00001.nc > Errors_output_parflow.out ;
           cp ./Errors_output_parflow.out ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/Errors_output_parflow.out ;

           echo "Ref_path= ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}/${model_id_sim}_${date_str}/";
           echo "Test_path= ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/"


      - name: compare_command
        tag: parflowgpu+!parflow+!eclm+!icon
        _:
           bash compare_nc_parflow.sh ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/${expid}.out.00001.nc ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}/${model_id_sim}_${date_str}/${expid}.out.00001.nc > Errors_output_parflow.out ;
           cp ./Errors_output_parflow.out ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/Errors_output_parflow.out ;
           
           echo "Ref_path= ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}/${model_id_sim}_${date_str}/";
           echo "Test_path= ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/"           

      - name: compare_command
        tag: icon+!eclm+!parflow+!parflowgpu
        _:
           bash compare_nc_icon.sh ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/ICON_out_EU-R13B5_inst_DOM01_ML_${date_rest_icon}T000000Z_1h.nc ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}/${model_id_sim}_${date_str}/ICON_out_EU-R13B5_inst_DOM01_ML_${date_rest_icon}T000000Z_1h.nc > Errors_output_icon.out ;
           cp ./Errors_output_icon.out ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/Errors_output_icon.out ;
           
           echo "Ref_path= ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}/${model_id_sim}_${date_str}/";
           echo "Test_path= ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/"

      - name: compare_command
        tag: eclm+parflow+!parflowgpu+!icon
