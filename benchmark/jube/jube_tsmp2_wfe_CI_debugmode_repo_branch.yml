# ----------------------------------------------------------------------------------------------------------------
# Section 2: Execution Steps
# ----------------------------------------------------------------------------------------------------------------
step:
 # 0. Check if systemname is set
  - name: input
    use:
      - systemInfo
      - inputParam
    do:
      - echo "Do nothing"
      
 # 1. Build and Install
  - name: build
    depend: input 
    use:
     - systemInfo
     - combinationTsmp
     - execMode
     - userInfo
     - testcaseInfo
    do: ${build_command}

 # 2. Verify build 
  - name: verifybuild  
    depend: build
    use:
     - systemInfo
     - userInfo
     - combinationTsmp
    do:
      - |
        echo "build_env_path = $build_env_path "
        echo "bin_storage = ${root_storage}/bin "
        if [[ -f $build_env_path ]]; then
          echo "true" > build_available
          mkdir -p ${bin_storage}/${branch_name}/${system_name}_${model_id}_${env_str} ;
          cp -r ./build/TSMP2/bin/${system_name}_${model_id}/* ${bin_storage}/${branch_name}/${system_name}_${model_id}_${env_str}
        else
          echo "Build failed"
          echo "false" > build_available
        fi
     
 # 3. Download data
  - name: download
    depend: verifybuild
    use:  
      - downloadData
      - systemInfo
    do:
      - |
        if [[ -f $build_env_path ]]; then
          ${download_command}
        else
          echo "Build failed"
        fi
        
 # 4. Run test
  - name: execute
    tag: full|run  
    depend: download
    use:
      - systemInfo
      - inputParam
      - combinationTsmp
      - testcaseInfo
      - execMode
      - finished_run
    do:
      - done_file: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/${done_run}
        _: |
          if [[ -f $build_env_path ]]; then
            ${run_command}
          else
            echo "Build failed"
            mkdir -p ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}
            echo "Mock done file" > ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/${done_run}
          fi
          cp ${jube_benchmark_rundir}/000002_verifybuild/work/build_available ${jube_benchmark_rundir}/000004_execute/work/
      - echo "true" > success
      
 # 5. Verify the results of the simulation
  - name: verify
    tag: full|run  
    depend: execute
    do:
      - |
        execute_step=$(cat execute/success)
        if [[ "$execute_step" == "true" ]]; then
          echo "true"
        else
          echo "false"
        fi

 # 6. Compare test with reference
  - name: compare
    tag: full|run
    depend: verify
    use:  
      - auxcompare
      - combinationTsmp
      - compareTsmp
      - systemInfo
      - testcaseInfo
      
    do: 
      - |
        if [[ -f $build_env_path ]]; then
          ${compare_command}
        else  
          echo "Build failed"
        fi
 
# -------------------------------------------------------------------------------------------------
# Section 3: Analysis of Results
# -------------------------------------------------------------------------------------------------
patternset:
  - name: build_pattern
    pattern:
      - name: available_build
        _: $jube_pat_wrd

  - name: done_pattern
    pattern:
      - name: date_build
        type: string
        _: '(\d{4}-\d{2}-\d{2}\s+(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d)'

  - name: runtime_pattern
    pattern:
      - name: runtime
        type: string
        _: 'runtime:\s+(\d*:[0-5]\d:[0-5]\d)\s+'

      - name: runtime_sec
        type: int
        _: 'The runtime is $jube_pat_int'
 
  - name: time_pattern_eclm
    pattern:
      - name: init_eclm
        type: string
        _: 'CPL:INIT"\s+-\s+\d+\s+-\s+([0-9.]+)'

      - name: run_loop_eclm
        type: string
        _: 'CPL:RUN_LOOP"\s+-\s+\d+\s+-\s+([0-9.]+)'

  - name: time_pattern_parflow
    pattern:
      - name: solver_pfl
        type: string
        _: 'Solver,([\d.eE+-]+),'

      - name: richards_exclude_pfl
        type: string
        _: 'Richards Exclude 1st Time Step,([\d.eE+-]+),'
 
      - name: kinsol_pfl
        type: string
        _: 'KINSol,([\d.eE+-]+),'

      - name: total_runtime_pfl
        type: string
        _: 'Total Runtime,([\d.eE+-]+),' 

  - name: time_pattern_icon
    pattern:
      - name: total_ave_icon
        type: float
        _: 'total\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+([\d.]+)'

      - name: physics_ave_icon
        type: float
        _: 'physics\s+\d+\s+\S+\s+\[\d+\]\s+\S+\s+\S+\s+\[\d+\]\s+[0-9.]+\s+\[\d+\]\s+[0-9.]+\s+\[\d+\]\s+([0-9.]+)'

      - name: modelinit_ave_icon
        type: float
        _: 'model_init\s+[1-9][0-9][0-9]*\s+\S+\s+\[\d+\]\s+\S+\s+\S+\s+\[\d+\]\s+[0-9.]+\s+\[\d+\]\s+[0-9.]+\s+\[\d+\]\s+([0-9.]+)'
        
  - name: success_pattern
    pattern:
      - name: success
        _: $jube_pat_wrd
        
  - name: jobid_pattern
    pattern:
      - name: jobid
        type: int
        _: $jube_pat_int
        
  - name: nodes_pattern
    pattern:
      - name: nodes
        type: int
        _: '--nodes=$jube_pat_int'

  - name: tasks_pattern
    pattern:
      - name: ntasks
        type: int
        _: '--ntasks=$jube_pat_int'

  - name: compare_pattern_eclm
    pattern:
      - name: comparison_eclm
        tag: eclm|(!icon+!eclm+!parflow+!parflowgpu)
        _: 'The eCLM comparison is $jube_pat_wrd'

  - name: compare_pattern_parflow
    pattern:
      - name: comparison_parflow
        tag: parflow|parflowgpu
        _: 'The parflow comparison is $jube_pat_wrd'
          
  - name: compare_pattern_icon
    pattern:
      - name: comparison_icon
        tag: icon
        _: 'The icon comparison is $jube_pat_wrd'

  - name: compare_sum
    pattern:
      - name: comparison_eclm_value
        _: 'eclm $jube_pat_int'
        default: 0 

      - name: comparison_parflow_value
        _: 'parflow $jube_pat_int'
        default: 0 
 
      - name: comparison_icon_value
        _: 'icon $jube_pat_int'
        default: 0 
 
      - name: comp_sum_failed
        type: int
        mode: python
        _: "$comparison_eclm_value + $comparison_parflow_value + $comparison_icon_value"
        

analyser:

  - name: build_info
    analyse:
      tag: build|!full+!build+!run
      step: build
      file:
        - use: build_pattern
          _: ${jube_benchmark_rundir}/000002_verifybuild/work/build_available
        - use: done_pattern
          _: ${jube_benchmark_rundir}/000001_build/done

  - name: bench_info
    analyse:
      tag: full|run
      step: execute
      file:
        - use: build_pattern
          _: ${jube_benchmark_rundir}/000004_execute/work/build_available
        - use: runtime_pattern
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/${expid}_sim_${date_str}000000_*.out
        - use: jobid_pattern
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/run.jobid
        - use: success_pattern
          _: success
        - use: nodes_pattern
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/tsmp2.job
        - use: tasks_pattern
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/tsmp2.job
        - use: compare_pattern_eclm
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/Errors_output_eclm.out
        - use: compare_pattern_parflow
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/Errors_output_parflow.out
        - use: compare_pattern_icon
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/Errors_output_icon.out
        - use: time_pattern_eclm
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/timing/model_timing.0*
        - use: time_pattern_parflow
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/${expid}.out.timing.csv
        - use: time_pattern_icon
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/${expid}_sim_${date_str}000000_*.err
        - use: compare_sum
          _: ${jube_benchmark_rundir}/000006_compare/work/comparison_sum.out


