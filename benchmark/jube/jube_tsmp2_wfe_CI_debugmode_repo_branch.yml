          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/${expid}_sim_${date_str}_*.err
        - use: compare_sum
          _: ${jube_benchmark_rundir}/000006_compare/work/comparison_sum.out


