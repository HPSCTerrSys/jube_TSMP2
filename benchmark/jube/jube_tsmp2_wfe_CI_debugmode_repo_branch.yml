# -------------------------------------------------------------------------------------------------
# Section 0: Preamble
# -------------------------------------------------------------------------------------------------
# The name of the benchmark
name: TSMP2_WFE

# Working directory of the workflow step
# Set the outpath to `/dev/null` to force the user to specify an output path manually
# jube -v run -r -e --tag <machineTag> <combinationTag> --outpath ./outpath  jube_tsmp2_build.yml 
outpath: /dev/null

# -------------------------------------------------------------------------------------------------
# Section 1: Parameter Configuration
# -------------------------------------------------------------------------------------------------

# Make auxiliary source/files available to the workflow
# The locations can be relative to the jube file
# .../benchmark/jube/jube_tsmp2_wfe_CI.yml
fileset:        
 - name: auxcompare
   copy: ../../usecompare/*

parameterset:
  # 0. User specific information running the benchmark
  #  MODIFY: 
  #         branch_name: master, dev-name  # Write the name of the branch you want to use from TSMP2
  #         bin_storage:                   # Write the path where to store binaries built
  #                                        # Binaries will be copied in ${bin_storage}/${branch_name}/${system_name}_${model_id}_${env_str}
  #         ref_storage:                   # Reference case will be retrieved from ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}
  #         ref_system: JURECADC, JUPITER  # Write the name of the system from the reference case (Note: JURECADC has all reference cases)
  #         ref_branch: master             # Write the name of the reference branch (Note: master has all reference cases)
  #         ref_env: jsc.2025.gnu.openmpi  # Write the environment from the reference case (gnu.openmpi and gnu.psmpi produce same results, but not intel.psmpi)
  #                                        # /p/project1/cslts/shared_data/CI_TSMP2/out_ref/JURECADC_jsc.2025.gnu.openmpi/
  #                                          ${ref_storage}/${ref_system}_${ref_env}
  #                                        # TO DO if all machines and environments have references then replace ref_system and ref_env by ${system_name} and ${env_str}
  - name: userInfo
    parameter:
      - {name: branch_name, _: master}          # master, parallel-build-mvh
      - {name: ref_branch, _: master}
      - {name: ref_env, _: jsc.2025.gnu.openmpi}                  # jsc.2025.gnu.openmpi, $env_str
      - {name: ref_system, _: JURECADC}               # JURECADC, $system_name
      - {name: ref_system, tag: jupiter,_: JUPITER}   # JURECADC, $system_name

  # 00. Info test case used
  # WFE: name of the repository, e.g., TSMP2_workflow-engine
  # branch_name_WFE: name of the branch to use from the WFE repository, e.g., master
  # date_str: initialdate of the simulation (YYYYMMDD)
  # date_rest_short: date of the restart file no separators (YYYYMMDD)
  # date_rest_long: date of the restart file with separators (YYYY-MM-DD)
  # expid: expid of the experiment in the master.conf file (in ctl/), e.g., eur-11u

  - name: testcaseInfo
    parameter:
    - {name: WFE, _: TSMP2_workflow-engine}
    - {name: branch_name_WFE, _: dev-gpu}    # master, dev-gpu    - {name: date_str, _: 20170701}
    - {name: date_rest_short, _: 20170702}
    - {name: date_rest_long, _: 2017-07-02}  
    - {name: expid, _: eur-11u}

  # 000. Add parameters to platform.xml
  - name: executeset
    init_with: platform.xml
    parameter:
      - {name: sim_path, _: "${WFE}/run/sim_${model_id_sim}_${date_str}"}
      - {name: done_file, _: "${sim_path}/${done_run}"}


  # 0000. System specific information running the benchmark
  #    Tags for each machine: jurecadc, juwels, jupiter, jusuf
  - name: systemInfo
    parameter:
      - name: system_name_hardcode
        mode: shell
        _: "cat /etc/FZJ/systemname |tr -d \"\n\""
      # Eventually, the version would be dynamically read, till then we hardcode the value.
      # --> NOT USED ?--> TO DO: REMOVE
      - name: system_version
        mode: shell
        _: "echo 2024.01"
 
      - {name: mode_exec, tag: full, _: full}
      - {name: mode_exec, tag: build, _: build}
      - {name: mode_exec, tag: run, _: run} 
        
      - {name: system_name, tag: jurecadc, _: JURECADC}
      - {name: system_name, tag: juwels, _: JUWELS}
      - {name: system_name, tag: jupiter, _: JUPITER}
      - {name: system_name, tag: jusuf, _: JUSUF}

      - {name: taskspernode, tag: gpu, _: 4}
      - {name: taskspernode, tag: jurecadc, _: 128}
      - {name: taskspernode, tag: juwels, _: 48}
      - {name: taskspernode, tag: jupiter, _: 288}
      - {name: taskspernode, tag: jusuf, _: 128}
      
      - {name: threadspertask, tag: gpu, _: 4}
      - {name: threadspertask, tag: jurecadc, _: 128}
      - {name: threadspertask, tag: juwels, _: 48}
      - {name: threadspertask, tag: jupiter, _: 288}
      - {name: threadspertask, tag: jusuf, _: 128}
      
      - {name: pfl_nodes, tag: parflowgpu, _: 1}
      - {name: pfl_nodes, tag: (jurecadc|juwels|jusuf)+!parflowgpu, _: 2}
      - {name: pfl_nodes, tag: jupiter, _: 1}
 
      - {name: clm_nodes, tag: jurecadc|juwels|jusuf, _: 1}
      - {name: clm_nodes, tag: jupiter, _: 1}  

      - {name: ico_nodes, tag: icongpu, _: 1}
      - {name: ico_nodes, tag: (jurecadc|juwels|jusuf)+!icongpu, _: 3}
      - {name: ico_nodes, tag: jupiter+!icongpu, _: 1}

      - {name: root_storage, tag: jurecadc|jusuf|juwels, _: "/p/project1/cslts/shared_data/CI_TSMP2"}
      - {name: root_storage, tag: jupiter, _: "/e/project1/eessx/shared_data/CI_TSMP2"}

      - {name: bin_storage, _: "${root_storage}/bin"}      
      # - {name: bin_storage, tag: jurecadc|jusuf|juwels, _: "/p/project1/cslts/shared_data/CI_TSMP2/bin"}
      # - {name: bin_storage, tag: jupiter, _: "/e/project1/eessx/shared_data/CI_TSMP2/bin"}

      - {name: ref_storage, _: "${root_storage}/out_ref"}      
      # - {name: ref_storage, tag: jurecadc|jusuf|juwels, _: "/p/project1/cslts/shared_data/CI_TSMP2/out_ref"}
      # - {name: ref_storage, tag: jupiter, _: "/e/project1/eessx/shared_data/CI_TSMP2/out_ref"}

      - {name: build_env_path, _: "${jube_benchmark_rundir}/000001_build/work/TSMP2/bin/${system_name}_${model_id}/${env_str}"}
      - {name: compare_path, _: "${jube_benchmark_rundir}/000006_compare/work/"} 


  # 1. File name to check run is finished   
  # - name: finished_run
    # parameter:
      # - {name: done_run, _: ready}
  - name: finished_run
    parameter:
    - {name: done_run, _: "eCLM_${expid}.datm.rs1.${date_rest_long}-00000.bin"}  
    - {name: done_run, tag: (icon|icongpu)+(!eclm+!parflow+!parflowgpu), _: "output_schedule.ps"}
    - {name: done_run, tag: eclm+(!icon+!icongpu+!parflow+!parflowgpu), _: "eCLM_${expid}.datm.rs1.${date_rest_long}-00000.bin"}
    - {name: done_run, tag: (parflow|parflowgpu)+(!icon+!icongpu+!eclm), _: "${expid}.out.timing.csv"}
    - {name: done_run, tag: (icon|icongpu)+eclm+(!parflow+!parflowgpu), _: "eCLM_${expid}.datm.rs1.${date_rest_long}-00000.bin"}
    - {name: done_run, tag: eclm+(parflow|parflowgpu)+(!icon+!icongpu), _: "eCLM_${expid}.datm.rs1.${date_rest_long}-00000.bin"}
    - {name: done_run, tag: (icon|icongpu)+eclm+(parflow|parflowgpu), _: "eCLM_${expid}.datm.rs1.${date_rest_long}-00000.bin"}
 
 
  # 2. TSMP2-components for the build
  #    Tags for each TSMP2 component: icon, eclm, parflow
  #    If no component-combination is specified, it will build by default "eclm" 
  #    If no environment is specified, it will use "default.2025.env"
  #    a) combination_str   --> components for the build command
  #    b) model_id          --> model ID to use for the building folders
  #    c) env_str           --> tag that defines the environment
  #
  - name: combinationTsmp
    parameter: 
  #  
  # 2.a For the build command: TO DO add parflowGPU
    - {name: combination_str, _: --eclm}
    - {name: combination_str, tag: icon+(icongpu+!eclm+!parflow+!parflowgpu), _: --icon}
    - {name: combination_str, tag: icongpu+(icon+!eclm+!parflow+!parflowgpu), _: --icongpu}    
    - {name: combination_str, tag: eclm+(!icon+!icongpu+!parflow+!parflowgpu), _: --eclm}
    - {name: combination_str, tag: parflow+(!icon+!icongpu+!eclm+!parflowgpu), _: --parflow}
    - {name: combination_str, tag: parflowgpu+(!icon+!icongpu+!eclm+!parflow), _: --parflowGPU}
    - {name: combination_str, tag: icon+eclm+(!icongpu+!parflow+!parflowgpu), _: --icon --eclm}
    - {name: combination_str, tag: icongpu+eclm+(!icon+!parflow+!parflowgpu), _: --icongpu --eclm}
    - {name: combination_str, tag: eclm+parflow+(!icon+!icongpu+!parflowgpu), _: --eclm --parflow}
    - {name: combination_str, tag: eclm+parflowgpu+(!icon+!icongpu+!parflow), _: --eclm --parflowgpu}
    - {name: combination_str, tag: icon+eclm+parflow+(!icongpu+!parflowgpu), _: --icon --eclm --parflow}
    - {name: combination_str, tag: icongpu+eclm+parflow+(!icon+!parflowgpu), _: --icongpu --eclm --parflow}
    - {name: combination_str, tag: icon+eclm+parflowgpu+(!icongpu+!parflow), _: --icon --eclm --parflowgpu}
    - {name: combination_str, tag: icongpu+eclm+parflowgpu+(!icon+!parflow), _: --icongpu --eclm --parflowgpu}
  #
    # 2.b Model ID for build:
    - {name: model_id, _: eCLM}
    - {name: model_id, tag: icon+(!icongpu+!eclm+!parflow+!parflowgpu), _: ICON}
    - {name: model_id, tag: icongpu+(!icon+!eclm+!parflow+!parflowgpu), _: ICONGPU}
    - {name: model_id, tag: eclm+(!icon+!icongpu+!parflow+!parflowgpu), _: eCLM}
    - {name: model_id, tag: parflow+(!icon+!icongpu+!eclm+!parflowgpu), _: ParFlow}
    - {name: model_id, tag: parflowgpu+(!icon+!icongpu+!eclm+!parflow), _: ParFlowGPU}
    - {name: model_id, tag: icon+eclm+(!icongpu+!parflow+!parflowgpu), _: ICON-eCLM}
    - {name: model_id, tag: icongpu+eclm+(!icon+!parflow+!parflowgpu), _: ICONGPU-eCLM}
    - {name: model_id, tag: eclm+parflow+(!icon+!icongpu+!parflowgpu), _: eCLM-ParFlow}
    - {name: model_id, tag: eclm+parflowgpu+(!icon+!icongpu+!parflow), _: eCLM-ParFlowGPU}
    - {name: model_id, tag: icon+eclm+parflow+(!icongpu+!parflowgpu), _: ICON-eCLM-ParFlow}
    - {name: model_id, tag: icongpu+eclm+parflow+(!icon+!parflowgpu), _: ICONGPU-eCLM-ParFlow}
    - {name: model_id, tag: icon+eclm+parflowgpu+(!icongpu+!parflow), _: ICON-eCLM-ParFlowGPU}
    - {name: model_id, tag: icongpu+eclm+parflowgpu+(!icon+!parflow), _: ICONGPU-eCLM-ParFlowGPU}   
  #  
    # 2.b Model ID for running sim:
    - {name: model_id_sim, _: eclm}
    - {name: model_id_sim, tag: (icon|icongpu)+(!eclm+!parflow+!parflowgpu), _: icon}
    - {name: model_id_sim, tag: eclm+(!icon+!icongpu+!parflow+!parflowgpu), _: eclm}
    - {name: model_id_sim, tag: (parflow|parflowgpu)+(!icon+!icongpu+!eclm), _: parflow}
    - {name: model_id_sim, tag: (icon|icongpu)+eclm+(!parflow+!parflowgpu), _: iconeclm}
    - {name: model_id_sim, tag: eclm+(parflow|parflowgpu)+(!icon+!icongpu), _: eclmparflow}
    - {name: model_id_sim, tag: (icon|icongpu)+eclm+(parflow|parflowgpu), _: iconeclmparflow} 
    # May need to add new tags when changes are made to the TSMP2_workflow-engine to run parflowGPU and ICON-GPU
    # eclmparflowgpu
    # iconeclmparflowgpu
    # icongpu 
  #
  # 2.c Environment:
    - {name: env_str, _: jsc.2025.gnu.openmpi}                                          
    - {name: env_str, tag: jsc.2026.nvhpc.openmpi, _: jsc.2026.nvhpc.openmpi}
    - {name: env_str, tag: jsc.2026.gnu.openmpi, _: jsc.2026.gnu.openmpi}
    - {name: env_str, tag: jsc.2025.gnu.openmpi, _: jsc.2025.gnu.openmpi}
    - {name: env_str, tag: jsc.2025.gnu.psmpi, _: jsc.2025.gnu.psmpi}
    - {name: env_str, tag: jsc.2025.intel.psmpi, _: jsc.2025.intel.psmpi}
    - {name: env_str, tag: jsc.2024.intel.psmpi, _: jsc.2024.intel.psmpi}
    - {name: env_str, tag: jsc.2023.intel.psmpi, _: jsc.2023.intel.psmpi}
    - {name: env_str, tag: default.2025.env, _: jsc.2025.gnu.openmpi}
    #- {name: env_str, tag: "!jsc.2025.intel.psmpi+!jsc.2025.gnu.openmpi+!jsc.2025.gnu.psmpi+!jsc.2024.intel.psmpi+!jsc.2023.intel.psmpi+!default.2025.env+!jsc.2026.gnu.openmpi+!jsc.2026.nvhpc.openmpi", _: jsc.2025.intel.psmpi}


  # 3. Collect the input parameters which are specified either through:
  #    - the tags passed on the JUBE-command or 
  #    - the "usecase" variable of the CI-gitlab 
  - name: inputParam
    parameter: 

    # Bench cpu queues:
    - {name: bench_queue, tag: jurecadc, _: dc-cpu}
    - {name: bench_queue, tag: juwels, _: batch}
    - {name: bench_queue, tag: jusuf, _: batch}
    - {name: bench_queue, tag: jupiter, _: booster}
    # Bench gpu queues: 
    - {name: bench_queue, tag: jurecadc, _: dc-gpu}
    - {name: bench_queue, tag: juwels, _: booster}
    - {name: bench_queue, tag: jusuf, _: gpus}
    - {name: bench_queue, tag: jupiter, _: booster}

    # Change account     
    - {name: bench_account, tag: jurecadc, _: slts}
    - {name: bench_account, tag: juwels, _: slts}
    - {name: bench_account, tag: jusuf, _: slts}
    - {name: bench_account, tag: jupiter, _: eessx}
    
    # Define parameter for the number of nodes
    - {name: variant, tag: single, _: single}
    - {name: variant, tag: strong.tiny, _: strong.stiny}
    - {name: variant, tag: "!single+!strong.tiny", _: single}
 

# ----------------------------------------------------------------------------------------------------------------
# Section 2: Execution Steps
# ----------------------------------------------------------------------------------------------------------------
step:
 # 0. Check if systemname is set
  - name: input
    use:
      - systemInfo
      - inputParam
    do:
      - echo "Do nothing"
      
 # 1. Build and Install
  - name: build
    depend: input 
    use:
     - systemInfo
     - combinationTsmp
     - userInfo
     - testcaseInfo
    do: !include steps/build.yml:["dos"]

 # 2. Verify build 
  - name: verifybuild  
    depend: build
    use:
     - systemInfo
     - userInfo
     - combinationTsmp
    do: !include steps/verifybuild.yml:["dos"]
     
 # 3. Download data
  - name: download
    depend: verifybuild
    use:  
      - systemInfo
    do: !include steps/download.yml:["dos"]
        
 # 4. Run test
  - name: execute
    tag: '(full|run)+!gpu'  
    depend: [download,verifybuild]
    use:
      - systemInfo
      - inputParam
      - combinationTsmp
      - testcaseInfo
      - finished_run
      - executeset
    do: !include steps/execute.yml:["dos"]

 # 4. Run test GPU
  - name: execute
    tag: (full|run)+gpu  
    depend: [download,verifybuild]
    use:
      - systemInfo
      - inputParam
      - combinationTsmp
      - testcaseInfo
      - finished_run
      - executeset
    do: !include steps/execute_gpu.yml:["dos"]    
      
 # 5. Verify the results of the simulation
  - name: verify
    tag: full|run  
    depend: execute
    do: !include steps/verify.yml:["dos"]

 # 6. Compare test with reference
  - name: compare
    tag: full|run
    depend: verify
    use:  
      - auxcompare
      - combinationTsmp
      - systemInfo
      - testcaseInfo     
    do: !include steps/compare.yml:["dos"]
 
# -------------------------------------------------------------------------------------------------
# Section 3: Analysis of Results
# -------------------------------------------------------------------------------------------------
patternset:
  - name: build_pattern
    pattern:
      - name: available_build
        _: $jube_pat_wrd

  - name: done_pattern
    pattern:
      - name: date_build
        type: string
        _: '(\d{4}-\d{2}-\d{2}\s+(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d)'

  - name: buildtime_pattern
    pattern:
      - name: buildtime_sec
        _: '$jube_pat_int'      

  - name: runtime_pattern
    pattern:
      - name: runtime
        type: string
        _: 'runtime:\s+(\d*:[0-5]\d:[0-5]\d)\s+'

      - name: runtime_sec
        type: int
        _: 'The runtime is $jube_pat_int'
 
  - name: time_pattern_eclm
    pattern:
      - name: init_eclm
        type: float
        _: 'CPL:INIT"\s+-\s+\d+\s+-\s+$jube_pat_fp'

      - name: run_loop_eclm
        type: float
        _: 'CPL:RUN_LOOP"\s+-\s+\d+\s+-\s+$jube_pat_fp'

  - name: time_pattern_parflow
    pattern:
      - name: solver_pfl
        type: float
        _: 'Solver,$jube_pat_fp,'

      - name: richards_exclude_pfl
        type: float
        _: 'Richards Exclude 1st Time Step,$jube_pat_fp,'

      - name: kinsol_pfl
        type: float
        _: 'KINSol,$jube_pat_fp,'

      - name: total_runtime_pfl
        type: float
        _: 'Total Runtime,$jube_pat_fp,' 

  - name: time_pattern_icon
    pattern:
      - name: total_ave_icon
        type: float
        _: 'total\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+$jube_pat_fp'

      - name: physics_ave_icon
        type: float
        _: 'physics\s+\d+\s+\S+\s+\[\d+\]\s+\S+\s+\S+\s+\[\d+\]\s+[0-9.]+\s+\[\d+\]\s+[0-9.]+\s+\[\d+\]\s+$jube_pat_fp'

      - name: modelinit_ave_icon
        type: float
        _: 'model_init\s+[1-9][0-9][0-9]*\s+\S+\s+\[\d+\]\s+\S+\s+\S+\s+\[\d+\]\s+[0-9.]+\s+\[\d+\]\s+[0-9.]+\s+\[\d+\]\s+$jube_pat_fp'
        
  - name: success_pattern
    pattern:
      - name: success
        _: $jube_pat_wrd
        
  - name: jobid_pattern
    pattern:
      - name: jobid
        type: int
        _: $jube_pat_int
        
  - name: nodes_pattern
    pattern:
      - name: nodes
        type: int
        _: '--nodes=$jube_pat_int'

  - name: tasks_pattern
    pattern:
      - name: ntasks
        type: int
        _: '--ntasks=$jube_pat_int'

  - name: compare_pattern_eclm
    pattern:
      - name: comparison_eclm
        tag: eclm|(!icon+!eclm+!parflow+!parflowgpu)
        _: 'The eCLM comparison is $jube_pat_wrd'

  - name: compare_pattern_parflow
    pattern:
      - name: comparison_parflow
        tag: parflow|parflowgpu
        _: 'The parflow comparison is $jube_pat_wrd'
          
  - name: compare_pattern_icon
    pattern:
      - name: comparison_icon
        tag: icon
        _: 'The icon comparison is $jube_pat_wrd'

  - name: compare_sum
    pattern:
      - name: comparison_eclm_value
        _: 'eclm $jube_pat_int'
        default: 0 

      - name: comparison_parflow_value
        _: 'parflow $jube_pat_int'
        default: 0 
 
      - name: comparison_icon_value
        _: 'icon $jube_pat_int'
        default: 0 
 
      - name: comp_sum_failed
        type: int
        mode: python
        _: "$comparison_eclm_value + $comparison_parflow_value + $comparison_icon_value"
        

analyser:

  - name: build_info
    analyse:
      tag: build|!full+!build+!run
      step: build
      file:
        - use: build_pattern
          _: ${jube_benchmark_rundir}/000002_verifybuild/work/build_available
        - use: done_pattern
          _: ${jube_benchmark_rundir}/000001_build/done
        - use: buildtime_pattern
          _: ${jube_benchmark_rundir}/000001_build/work/build_time_seconds.txt

  - name: bench_info
    analyse:
      tag: full|run
      step: execute
      file:
        - use: build_pattern
          _: ${jube_benchmark_rundir}/000004_execute/work/build_available
        - use: buildtime_pattern
          _: ${jube_benchmark_rundir}/000001_build/work/build_time_seconds.txt                   
        - use: runtime_pattern
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/${expid}_sim_${date_str}_*.out
        - use: jobid_pattern
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/run.jobid
        - use: success_pattern
          _: success
        - use: nodes_pattern
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/tsmp2.job
        - use: tasks_pattern
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/tsmp2.job
        - use: compare_pattern_eclm
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/Errors_output_eclm.out
        - use: compare_pattern_parflow
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/Errors_output_parflow.out
        - use: compare_pattern_icon
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/Errors_output_icon.out
        - use: time_pattern_eclm
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/timing/model_timing.0*
        - use: time_pattern_parflow
          _: ${jube_benchmark_rundir}/000004_execute/work/${WFE}/run/sim_${model_id_sim}_${date_str}/${expid}.out.timing.csv
