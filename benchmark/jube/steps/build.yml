dos:
  # TO BUILD
    # added brackets around AND expression; please check
  - tag: full|build|(!full+!build+!run)
    _: |
       git clone -b ${branch_name} https://github.com/HPSCTerrSys/TSMP2.git ;
       cd TSMP2 ;
       echo $$(pwd) ; # use $$ because pwd is not a JUBE parameter, but a built-in shell variable
       git branch -a ;
       echo $$(pwd) ;
       ml ;
       echo "build_tsmp2.sh ${combination_str} --env ./env/${env_str}" ;
       echo "Starting build at $(date)" ;
       TIME_START=$(date +%s) ;
       bash build_tsmp2.sh ${combination_str} --env ./env/${env_str} ;
       TIME_END=$(date +%s) ;
       echo "Build TIME_END= $(date)" ;
       BUILD_sec=$((TIME_END - TIME_START)) ;
       echo "Build time is ${BUILD_sec} seconds" ;
       cd .. ;
       echo "${BUILD_sec}" > build_time_seconds.txt ;
       ml ;

  # TO NOT BUILD 
  # To save time when one build for that combination already exists
  # combination: systemname_components_environment. For instance: JURECADC_ICON-eCLM-ParFlow_jsc.2025.gnu.openmpi
  - tag: run
    _: |
       mkdir -p TSMP2/bin/${system_name}_${model_id} ;
       cp -r ${bin_storage}/${branch_name}/${system_name}_${model_id}_${env_str}/* ./TSMP2/bin/${system_name}_${model_id}
