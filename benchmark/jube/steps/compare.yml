       echo "Ref_path= ${ref_storage}/${ref_branch}/${ref_system}_${ref_env}/${model_id_sim}_20170701/";
       echo "Test_path= ${jube_benchmark_rundir}/000004_execute/work/TSMP2_workflow-engine/run/sim_${model_id_sim}_20170701/"

