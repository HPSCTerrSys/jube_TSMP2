dos:
  # Check existence of build env path only once
  # If path does not exist, exist before executing compare script
  # !!! UNTESTED !!!
  - |
    if [[ ! -f $build_env_path ]]; then
        echo "Build failed"
        exit 0 # script ends but reports success; use 1 to indicate a failure
    fi

  - tag: (eclm+!parflow+!icon+!parflowgpu)|(!icon+!eclm+!parflow+!parflowgpu)
